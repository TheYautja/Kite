name: Build APK

on:
  push:
    branches:
      - main
    pull_request:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pub Get
        run:
          flutter pub get

      - name: Build APK
        run: 
          flutter build apk
