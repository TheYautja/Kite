name: kiteapp
description: "A Flutter app to watch movies for free"
version: 1.0.1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  flutter_native_splash: ^2.4.8
  marquee: ^2.3.0
  auto_size_text: ^3.0.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  flutter_cache_manager: ^3.4.5
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  webview_all: ^1.4.4
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/kite.png" 


flutter:

  uses-material-design: true

  assets:
        - assets/images/kite.png
        - assets/images/placeholder.jpg
        - .env

